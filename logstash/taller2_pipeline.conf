input {
  # ==============================
  # FUENTE 1: MySQL
  # ==============================
  jdbc {
    jdbc_driver_library => "E:/USFQ/logstash-7.17.10/bin/mysql-connector-j-26.7.0.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://localhost:3306/staging_steam?useSSL=false&serverTimezone=America/Guayaquil&allowPublicKeyRetrieval=true"
    jdbc_user => "root"
    jdbc_password => "miclave"
    statement => "SELECT id, appid, evento, cantidad, fecha_evento, pais, ip_origen FROM eventos_juegos WHERE id > :sql_last_value ORDER BY id ASC"
    use_column_value => true
    tracking_column => "id"
    tracking_column_type => "numeric"
    schedule => "*/10 * * * * *"
    last_run_metadata_path => ".logstash_jdbc_last_run_eventos_juegos"
    clean_run => false
    
    # Etiqueta vital para separar el flujo
    type => "mysql" 
  }

  # ==============================
  # FUENTE 2: MongoDB
  # ==============================
  mongodb {
    uri => "mongodb://localhost:27017/staging_steam"
    placeholder_db_dir => "E:/USFQ/logstash-7.17.10/data/"
    placeholder_db_name => "logstash_mongo_tracking.db"
    collection => "eventos_foro"
    batch_size => 5000
    
    # Etiqueta vital para separar el flujo
    type => "mongodb" 
  }

  # ==============================
  # FUENTE 3: Archivo CSV (Logs)
  # ==============================
  file {
    # Asegúrate de crear este archivo en esta ruta, o actualiza la ruta
    path => "E:/USFQ/logstash-7.17.10/data/logs_servidor.csv"
    start_position => "beginning"
    sincedb_path => "E:/USFQ/logstash-7.17.10/data/.sincedb_csv"
    type => "csv_logs"
  }
}

filter {
  # --- Procesamiento exclusivo para MySQL ---
  if [type] == "mysql" {
    mutate {
      add_field => { "fuente" => "mysql_eventos_juegos" }
    }
    date {
      match => ["fecha_evento", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
    }
  }

  # --- Procesamiento exclusivo para MongoDB ---
  if [type] == "mongodb" {
    mutate {
      add_field => { "fuente" => "mongodb_eventos_foro" }
      remove_field => ["_id"] 
    }
    date {
      match => ["fecha_evento", "ISO8601"]
      target => "@timestamp"
    }
  }

  # --- Procesamiento exclusivo para CSV ---
  if [type] == "csv_logs" {
    csv {
      separator => ","
      columns => ["log_id", "appid", "estado_servidor", "ping_ms", "fecha_log"]
      skip_header => true
      convert => {
        "appid" => "integer"
        "ping_ms" => "float"
      }
    }
    mutate {
      add_field => { "fuente" => "csv_logs_servidor" }
    }
    date {
      match => ["fecha_log", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
    }
  }
}

output {
  # --- Enrutamiento exclusivo para MySQL ---
  if [type] == "mysql" {
    elasticsearch {
      hosts => ["http://localhost:9200"]
      index => "eventos_juegos-%{+YYYY.MM.dd}"
    }
  }

  # --- Enrutamiento exclusivo para MongoDB ---
  if [type] == "mongodb" {
    elasticsearch {
      hosts => ["http://localhost:9200"]
      index => "eventos_foro-%{+YYYY.MM.dd}" 
    }
  }

  # --- Enrutamiento exclusivo para CSV ---
  if [type] == "csv_logs" {
    elasticsearch {
      hosts => ["http://localhost:9200"]
      index => "logs_servidor-%{+YYYY.MM.dd}"
    }
  }

  # Salida global a consola para monitoreo
  stdout {
    codec => rubydebug
  }
}